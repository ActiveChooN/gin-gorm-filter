name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

  Lint:
    runs-on: ubuntu-latest
    needs: Build
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run go lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -v -vet=off ./...
